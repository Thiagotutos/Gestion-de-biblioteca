# =============================================================================
# Configuración Nginx para Sistema de Gestión de Biblioteca Escolar / Institucional
# Diseñado para acceso en Red Local (WiFi) y servidores de producción
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Acepta cualquier dominio o dirección IP en la red local (WiFi)
    server_name _;

    # Ruta raíz donde se ubican los archivos del sistema en el servidor
    root /var/www/biblioteca;
    index index.php login.php index.html;

    charset utf-8;

    # Tamaño máximo para subida de portadas de libros y respaldos SQL
    client_max_body_size 50M;

    # Logs del servidor
    access_log /var/log/nginx/biblioteca_access.log;
    error_log  /var/log/nginx/biblioteca_error.log;

    # Regla general de resolución de archivos
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de archivos PHP a través de PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Ajusta la versión de socket según tu versión instalada (PHP 8.0, 8.1, 8.2, 8.3)
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts generosos para exportar e importar bases de datos grandes
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Servir imágenes y portadas subidas con caché del navegador
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Denegar acceso directo a directorios y archivos confidenciales
    location ~ /\.(git|env|svn) {
        deny all;
        return 404;
    }

    location ~ /(database|deploy|docs)/ {
        deny all;
        return 404;
    }

    location = /config.php {
        deny all;
        return 404;
    }
}
